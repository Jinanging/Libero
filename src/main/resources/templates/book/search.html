<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8" />
  <title>Libero - 책 검색</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<header>
  <div class="logo">Libero</div>

  <form class="search-bar" method="get" action="/libero/book/search-view">
    <input type="text" name="keyword" placeholder="도서를 검색해보세요" required />
    <button type="submit" aria-label="검색">🔍</button>
  </form>

  <div class="login-btns">
    <span th:if="${userName != null}">
      <span th:text="${userName}">닉네임</span> | 
      <a class="btn" id="logoutBtn">로그아웃</a>
      <a class="btn">장바구니</a>
    </span>
    <span th:unless="${userName != null}">
      <a href="/libero/user/login-view">로그인</a> | 
      <a href="/libero/user/join-view">회원가입</a>
    </span>
  </div>
</header>

<nav class="d-flex justify-content-between gap-3 py-2 bg-light">
  <a href="/libero/book/list-view?categoryId=656" class="nav-link px-3">문학</a>
  <a href="/libero/book/list-view?categoryId=38401" class="nav-link px-3">컴퓨터</a>
  <a href="/libero/book/list-view?categoryId=1237" class="nav-link px-3">종교</a>
  <a href="/libero/book/list-view?categoryId=798" class="nav-link px-3">사회과학</a>
  <a href="/libero/book/list-view?categoryId=90855" class="nav-link px-3">자연과학</a>
  <a href="/libero/book/list-view?categoryId=50966" class="nav-link px-3">음악</a>
  <a href="/libero/book/list-view?categoryId=517" class="nav-link px-3">예술</a>
  <a href="/libero/book/list-view?categoryId=1" class="nav-link px-3">전체</a>
  <a href="/libero/diary" class="nav-link px-3">독서일기</a>
</nav>

<main class="container mt-4">
  <!-- 검색어 표시 -->
  <h4 th:if="${keyword != null}" class="mb-3" th:text="'&quot;' + ${keyword} + '&quot; 검색 결과'">검색 결과</h4>
  <p th:if="${#lists.isEmpty(books)}">검색 결과가 없습니다.</p>

  <div class="book-grid" th:if="${!#lists.isEmpty(books)}">
    <div th:each="book : ${books}" class="book-item">
      <a th:href="@{/libero/book/detail-view(itemId=${book.itemId})}" class="book-link">
        <img th:src="${#strings.replace(book.cover, 'coversum', 'cover500')}" alt="책 이미지" />
        <div class="book-info">
          <div class="book-title" th:text="${book.title}">책 제목</div>
          <div class="book-author" th:text="${book.author}">작가 이름</div>
        </div>
      </a>
    </div>
  </div>
</main>

<div class="pagination d-flex justify-content-center my-4">
  <!-- 첫 페이지로 이동 -->
  <a class="btn btn-outline-secondary mx-1"
     th:href="@{/libero/book/search-view(keyword=${keyword}, page=1)}"
     th:if="${currentPage > 1}">&laquo;</a>

  <!-- 동적 페이지 번호 3개 보여주기 -->
  <span th:with="startPage=${T(java.lang.Math).max(1, currentPage - 1)},
                 endPage=${T(java.lang.Math).min(totalPages, startPage + 2)}">
    <span th:each="i : ${#numbers.sequence(startPage, endPage)}">
      <a class="btn mx-1"
         th:href="@{/libero/book/search-view(keyword=${keyword}, page=${i})}"
         th:classappend="${currentPage == i} ? 'btn-primary' : 'btn-outline-primary'"
         th:text="${i}"></a>
    </span>
  </span>

  <!-- 마지막 페이지로 이동 -->
  <a class="btn btn-outline-secondary mx-1"
     th:href="@{/libero/book/search-view(keyword=${keyword}, page=${totalPages})}"
     th:if="${currentPage < totalPages}">&raquo;</a>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
  $("#logoutBtn").on("click", function () {
    $.ajax({
      type: "post",
      url: "/libero/user/logout",
      success: function (response) {
        if (response.result === "success") {
          location.href = "/libero/book/list-view?categoryId=1";
        } else {
          alert("로그아웃 실패: " + response.message);
        }
      },
      error: function () {
        alert("로그아웃 중 오류가 발생했습니다.");
      }
    });
  });
</script>

</body>
</html>
