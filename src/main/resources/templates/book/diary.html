<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Libero - 독서일기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
    }

    #wrap {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 250px;
      background-color: transparent;
      padding: 30px 15px;
    }

    .sidebar h2 {
      font-family: 'Great Vibes', cursive;
      color: #f8f9fa;
      font-size: 28px;
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      color: #fff;
      background-color: rgba(0, 0, 0, 0.4);
      text-decoration: none;
      margin: 10px 0;
      padding: 10px 15px;
      font-size: 18px;
      border-radius: 8px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .sidebar a:hover {
      background-color: rgba(0, 0, 0, 0.6);
      color: #ffc107;
    }

    .content {
      flex: 1;
      padding: 40px;
      background-image: url('/static/image/userpage.jpg.png');
      background-size: cover;
      background-position: center;
      overflow-y: auto;
      color: #333;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 10px;
      max-width: 800px;
      margin: auto;
    }

    .diary-item {
      background: #fff;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      color: #333;
    }

    .diary-actions button {
      margin-right: 10px;
    }

    textarea, input {
      width: 100%;
      margin-bottom: 10px;
    }

    #cancelEditBtn {
      margin-left: 10px;
    }
  </style>
</head>
<body>

<div id="wrap">
  <div class="sidebar">
    <h2 class="text-dark">My Diary</h2>
    <a href="#" onclick="showPage('write')">📖 일기 작성하기</a>
    <a href="#" onclick="showPage('list')">📚 일기 리스트</a>
    <a href="/libero/book/list-view?categoryId=1" class="btn btn-primary mt-3">📚 메인화면으로 돌아가기</a>
  </div>

  <div class="content" id="content-area">
    <!-- 여기에 일기 작성 or 리스트 콘텐츠가 동적으로 표시됩니다 -->
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
  const token = localStorage.getItem('accessToken'); // JWT 토큰
  if (!token) {
    alert('로그인이 필요합니다.');
  }

  function showPage(type) {
    const content = document.getElementById('content-area');
    let html = '';

    if (type === 'write') {
      html = `
        <div class="card">
          <h3>📝 일기 작성 / 수정</h3>
          <form id="diaryForm" onsubmit="event.preventDefault(); submitDiary();">
            <input type="hidden" id="diaryId" value="" />
            <div class="form-group">
              <label for="bookTitle">책 제목</label>
              <input type="text" id="bookTitle" placeholder="책 제목을 입력하세요" required />
            </div>
            <div class="form-group">
              <label for="readDate">읽은 날짜</label>
              <input type="date" id="readDate" required />
            </div>
            <div class="form-group">
              <label for="diaryContent">내용</label>
              <textarea id="diaryContent" rows="5" required placeholder="오늘 하루는 어땠나요?"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">저장</button>
            <button type="button" id="cancelEditBtn" class="btn btn-secondary" style="display:none;">취소</button>
            <div id="message" style="margin-top:10px;"></div>
          </form>
        </div>
      `;
      content.innerHTML = html;

      $('#cancelEditBtn').click(resetForm);
    }
    else if (type === 'list') {
      html = `
        <div class="card">
          <h3>📖 작성한 일기 목록</h3>
          <div id="diaryList"></div>
        </div>
      `;
      content.innerHTML = html;
      loadDiaryList();
    }
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;")
               .replace(/</g, "&lt;")
               .replace(/>/g, "&gt;")
               .replace(/"/g, "&quot;")
               .replace(/'/g, "&#039;");
  }

  function loadDiaryList() {
    $.ajax({
      url: '/libero/book/diary/list',
      method: 'GET',
      headers: { 'Authorization': `Bearer ${token}` },
      success: function(data) {
        const container = $('#diaryList');
        container.empty();

        if(data.length === 0) {
          container.append('<p>작성된 독서일기가 없습니다.</p>');
          return;
        }

        data.forEach(diary => {
          const bookTitle = diary.bookTitle || '알 수 없는 책';
          container.append(`
            <div class="diary-item" data-id="${diary.id}">
              <h5>${escapeHtml(bookTitle)} (${diary.readDate})</h5>
              <p>${escapeHtml(diary.contents)}</p>
              <div class="diary-actions">
                <button class="btn btn-sm btn-info edit-btn" data-id="${diary.id}">수정</button>
                <button class="btn btn-sm btn-danger delete-btn" data-id="${diary.id}">삭제</button>
              </div>
            </div>
          `);
        });
      },
      error: function(xhr) {
        if(xhr.status === 401) alert('로그인이 필요합니다.');
        else alert('독서일기 목록을 불러오는 데 실패했습니다.');
      }
    });
  }

  function submitDiary() {
    const id = $('#diaryId').val();
    const bookTitle = $('#bookTitle').val().trim();
    const readDate = $('#readDate').val();
    const contents = $('#diaryContent').val().trim();
    const messageEl = $('#message');

    messageEl.text('');
    messageEl.css('color', 'red');

    if (!bookTitle || !readDate || !contents) {
      messageEl.text('모든 필드를 입력해주세요.');
      return;
    }

    const diaryData = {
      bookTitle: bookTitle,
      readDate: readDate,
      contents: contents
    };

    if(id) diaryData.id = Number(id);

    $.ajax({
      url: '/libero/book/diary/save',
      method: 'POST',
      contentType: 'application/json',
      headers: { 'Authorization': `Bearer ${token}` },
      data: JSON.stringify(diaryData),
      success: function() {
        messageEl.css('color', 'green');
        messageEl.text('독서일기가 저장되었습니다.');
        resetForm();
        loadDiaryList();
        showPage('list');
      },
      error: function(xhr) {
        if(xhr.status === 401) messageEl.text('로그인이 필요합니다.');
        else if(xhr.status === 403) messageEl.text('권한이 없습니다.');
        else messageEl.text('저장 중 오류가 발생했습니다.');
      }
    });
  }

  function resetForm() {
    $('#diaryId').val('');
    $('#bookTitle').val('');
    $('#readDate').val('');
    $('#diaryContent').val('');
    $('#cancelEditBtn').hide();
    $('#message').text('');
  }

  $(document).on('click', '.edit-btn', function() {
    const diaryId = $(this).data('id');

    // 단건 조회 API가 id 기준이어야 하므로 백엔드도 확인 필요
    $.ajax({
      url: `/libero/book/diary/detail/${diaryId}`,
      method: 'GET',
      headers: { 'Authorization': `Bearer ${token}` },
      success: function(diary) {
        $('#diaryId').val(diary.id);
        $('#bookTitle').val(diary.bookTitle);
        $('#readDate').val(diary.readDate);
        $('#diaryContent').val(diary.contents);
        $('#cancelEditBtn').show();
        showPage('write');
        $('html, body').animate({ scrollTop: 0 }, 'fast');
      },
      error: function() {
        alert('일기를 불러오는데 실패했습니다.');
      }
    });
  });

  $(document).on('click', '.delete-btn', function() {
    if (!confirm('정말 삭제하시겠습니까?')) return;

    const diaryId = $(this).data('id');

    $.ajax({
      url: `/libero/book/diary/delete/${diaryId}`,
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` },
      success: function() {
        alert('독서일기가 삭제되었습니다.');
        loadDiaryList();
      },
      error: function(xhr) {
        if(xhr.status === 403) alert('삭제 권한이 없습니다.');
        else alert('삭제 실패');
      }
    });
  });

  // 초기 페이지: 작성 폼 보여주기
  $(function() {
    showPage('write');
  });
</script>

</body>
</html>
