<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8" />
  <title>Libero - 책 상세 정보</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    /* 가격 텍스트 스타일 */
    .book-price {
      font-size: 1.25rem;
      font-weight: bold;
      color: #000000; /* Bootstrap danger 계열 빨간색 */
      margin-top: 10px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Libero</div>
  <form class="search-bar d-flex" method="get" action="/libero/book/search-view">
    <input type="text" name="keyword" placeholder="도서를 검색해보세요" required />
    <button type="submit" aria-label="검색">🔍</button>
  </form>
  <div class="login-btns">
    <span th:if="${userName != null}">
      <span th:text="${userName}" id="userNameSpan">닉네임</span> | 
      <a class="btn" id="logoutBtn">로그아웃</a>
      <a href="http://localhost:8080/libero/cart/view" class="btn">장바구니</a>
    </span>
    <span th:unless="${userName != null}">
      <a href="/libero/user/login-view">로그인</a> | 
      <a href="/libero/user/join-view">회원가입</a>
    </span>
  </div>
</header>

<nav class="d-flex justify-content-between gap-3 py-2 bg-light">
  <a href="/libero/book/list-view?categoryId=656" class="nav-link px-3">문학</a>
  <a href="/libero/book/list-view?categoryId=38401" class="nav-link px-3">컴퓨터</a>
  <a href="/libero/book/list-view?categoryId=1237" class="nav-link px-3">종교</a>
  <a href="/libero/book/list-view?categoryId=798" class="nav-link px-3">사회과학</a>
  <a href="/libero/book/list-view?categoryId=90855" class="nav-link px-3">자연과학</a>
  <a href="/libero/book/list-view?categoryId=50966" class="nav-link px-3">음악</a>
  <a href="/libero/book/list-view?categoryId=517" class="nav-link px-3">예술</a>
  <a href="/libero/book/list-view?categoryId=1" class="nav-link px-3">전체</a>
  <a href="/libero/book/diary-view" class="nav-link px-3">독서일기</a>
</nav>

<main class="detail-container d-flex">
  <img th:src="${#strings.replace(book['cover'], 'coversum', 'cover500')}" alt="책 이미지" class="book-cover" />
  <div class="book-info">
    <h1 class="detail-book-title" th:text="${book['title']}">책 제목</h1>
    <div class="book-author" th:text="'저자: ' + ${book['author']}">작가 이름</div>
    <div class="book-meta" th:text="'출판사: ' + ${book['publisher']}">출판사</div>
    <div class="book-meta" th:text="'출판일: ' + ${book['pubDate']}">출판일</div>
    <div class="book-price" th:text="${book['priceSales'] != null ? '가격: ' + book['priceSales'] + '원' : '가격 정보 없음'}">가격: 정보 없음</div>
    <div class="book-description" th:text="${book['description']}">책 소개 및 상세 내용이 여기에 표시됩니다.</div>
    <button id="addToCartBtn" class="btn btn-primary mt-3">장바구니에 담기</button>
  </div>
</main>

<section class="review-section">
  <div class="review-box shadow-sm">
    <h3>📚 Libero 리뷰</h3>

    <div class="rating-group">
      <label class="rating-label">별점</label>
      <div class="star-rating-input">
        <div class="stars">
          <input type="radio" id="star5" name="rating" value="5" />
          <label for="star5">★</label>
          <input type="radio" id="star4" name="rating" value="4" />
          <label for="star4">★</label>
          <input type="radio" id="star3" name="rating" value="3" />
          <label for="star3">★</label>
          <input type="radio" id="star2" name="rating" value="2" />
          <label for="star2">★</label>
          <input type="radio" id="star1" name="rating" value="1" />
          <label for="star1">★</label>
        </div>
      </div>
    </div>

    <div class="comment-form">
      <textarea id="commentText" placeholder="후기를 입력해 주세요" rows="3"></textarea>
      <button type="button" id="submitReviewBtn" class="submit-btn">등록</button>
    </div>

    <div class="comment-list" id="commentList"></div>
  </div>
</section>

<!-- 숨겨진 태그에 값 저장 -->
<span id="hiddenBookId" th:text="${book != null && book['itemId'] != null} ? ${book['itemId']} : 0" style="display:none;"></span>
<span id="hiddenUserName" th:text="${userName != null} ? ${userName} : 'null'" style="display:none;"></span>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
  var bookId = parseInt(document.getElementById('hiddenBookId').textContent);
  var userName = document.getElementById('hiddenUserName').textContent;
  if(userName === 'null') userName = null;
  
  $("#logoutBtn").on("click", function () {
    $.ajax({
      type: "post",
      url: "/libero/user/logout",
      success: function (response) {
          if (response.result === "success") {
              location.href = "/libero/book/list-view?categoryId=1";
          } else {
              alert("로그아웃 실패: " + response.message);
          }
      },
      error: function () {
          alert("로그아웃 중 오류가 발생했습니다.");
      }
    });
  });

  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function loadComments() {
    $.ajax({
      url: `/libero/book/${bookId}/review`,
      method: 'GET',
      xhrFields: { withCredentials: true },
      success: function (data) {
        const commentList = $('#commentList');
        commentList.empty();

        if (data.length === 0) {
          commentList.append('<p>등록된 리뷰가 없습니다.</p>');
          return;
        }

        data.forEach(function(item) {
          const stars = '★'.repeat(Math.round(item.rating)) + '☆'.repeat(5 - Math.round(item.rating));
          const editableButtons = item.editable ? `
            <button class="edit-btn" data-id="${item.id}">수정</button>
            <button class="delete-btn" data-id="${item.id}">삭제</button>
          ` : '';

          const commentItem = `
            <div class="comment-item" data-id="${item.id}">
              <div class="comment-stars">${stars}</div>
              <div class="comment-text">${escapeHtml(item.comment)}</div>
              <div class="comment-user">작성자: ${escapeHtml(item.userName)}</div>
              <div class="comment-actions">${editableButtons}</div>
            </div>
          `;
          commentList.append(commentItem);
        });
      },
      error: function () {
        alert('리뷰 목록을 불러오는 데 실패했습니다.');
      }
    });
  }

  $(document).on('click', '.edit-btn', function() {
    const commentId = $(this).data('id');
    const commentDiv = $(`.comment-item[data-id=${commentId}]`);
    const originalText = commentDiv.find('.comment-text').text();
    const originalStars = commentDiv.find('.comment-stars').text().replace(/☆/g, '').length;

    if (commentDiv.find('textarea').length > 0) {
      return;
    }

    const editForm = `
      <textarea class="edit-textarea">${escapeHtml(originalText)}</textarea>
      <div class="edit-rating">
        별점: 
        <select class="edit-rating-select">
          <option value="5" ${originalStars === 5 ? 'selected' : ''}>5</option>
          <option value="4" ${originalStars === 4 ? 'selected' : ''}>4</option>
          <option value="3" ${originalStars === 3 ? 'selected' : ''}>3</option>
          <option value="2" ${originalStars === 2 ? 'selected' : ''}>2</option>
          <option value="1" ${originalStars === 1 ? 'selected' : ''}>1</option>
        </select>
      </div>
      <button class="update-btn" data-id="${commentId}">저장</button>
      <button class="cancel-btn" data-id="${commentId}">취소</button>
    `;

    commentDiv.find('.comment-text').hide();
    commentDiv.find('.comment-actions').hide();
    commentDiv.append(editForm);
  });

  $(document).on('click', '.cancel-btn', function() {
    const commentId = $(this).data('id');
    const commentDiv = $(`.comment-item[data-id=${commentId}]`);
    commentDiv.find('textarea').remove();
    commentDiv.find('.edit-rating').remove();
    commentDiv.find('.update-btn').remove();
    commentDiv.find('.cancel-btn').remove();
    commentDiv.find('.comment-text').show();
    commentDiv.find('.comment-actions').show();
  });

  $(document).on('click', '.update-btn', function() {
    const commentId = $(this).data('id');
    const commentDiv = $(`.comment-item[data-id=${commentId}]`);
    const newComment = commentDiv.find('textarea').val().trim();
    const newRating = commentDiv.find('.edit-rating-select').val();

    if (newComment.length === 0) {
      alert('댓글을 입력해주세요.');
      return;
    }

    $.ajax({
      url: `/libero/book/review/${commentId}`,
      method: 'PUT',
      contentType: 'application/json',
      xhrFields: { withCredentials: true },
      data: JSON.stringify({
        rating: newRating,
        comment: newComment
      }),
      success: function(response) {
        alert('리뷰가 수정되었습니다!');
        loadComments();
      },
      error: function(xhr) {
        if (xhr.status === 403) {
          alert('수정 권한이 없습니다.');
        } else if (xhr.status === 404) {
          alert('리뷰를 찾을 수 없습니다.');
        } else if (xhr.status === 401) {
          alert('로그인이 필요합니다.');
        } else {
          alert('리뷰 수정에 실패했습니다.');
        }
      }
    });
  });

  $(document).on('click', '.delete-btn', function() {
    if (!confirm('정말 삭제하시겠습니까?')) return;

    const commentId = $(this).data('id');

    $.ajax({
      url: `/libero/book/review/${commentId}`,
      method: 'DELETE',
      xhrFields: { withCredentials: true },
      success: function(response) {
        alert('리뷰가 삭제되었습니다!');
        loadComments();
      },
      error: function(xhr) {
        if (xhr.status === 403) {
          alert('삭제 권한이 없습니다.');
        } else if (xhr.status === 404) {
          alert('리뷰를 찾을 수 없습니다.');
        } else if (xhr.status === 401) {
          alert('로그인이 필요합니다.');
        } else {
          alert('리뷰 삭제에 실패했습니다.');
        }
      }
    });
  });

  $(document).ready(function() {
    loadComments();

    $('#submitReviewBtn').click(function() {
      const rating = $('input[name="rating"]:checked').val();
      const comment = $('#commentText').val().trim();

      if (!userName) {
        alert('로그인 후 이용해주세요.');
        return;
      }

      if (!rating) {
        alert('별점을 선택해주세요.');
        return;
      }

      if (comment.length === 0) {
        alert('댓글을 입력해주세요.');
        return;
      }

      $.ajax({
        url: `/libero/book/${bookId}/review`,
        method: 'POST',
        contentType: 'application/json',
        xhrFields: { withCredentials: true },
        data: JSON.stringify({
          rating: rating,
          comment: comment
        }),
        success: function(response) {
          alert('리뷰가 등록되었습니다!');
          $('input[name="rating"]').prop('checked', false);
          $('#commentText').val('');
          loadComments();
        },
        error: function(xhr) {
          if (xhr.status === 400) {
            alert('이미 리뷰를 작성하셨습니다.');
          } else if (xhr.status === 401) {
            alert('로그인이 필요합니다.');
          } else {
            alert('리뷰 등록에 실패했습니다.');
          }
        }
      });
    });

    // 장바구니 담기 버튼 클릭 이벤트
    $('#addToCartBtn').click(function() {
      if (!userName) {
        alert('로그인 후 이용해주세요.');
        return;
      }

      $.ajax({
        url: `/libero/cart/add`,
        method: 'POST',
        data: {
          bookId: bookId,
          count: 1
        },
        success: function(response) {
          if (response.success) {
            alert(response.message);
          } else {
            alert('장바구니 담기에 실패했습니다: ' + response.message);
          }
        },
        error: function() {
          alert('장바구니 담기에 실패했습니다.');
        }
      });
    });
  });
</script>

</body>
</html>
